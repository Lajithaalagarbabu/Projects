# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=pg-management-backend

# Database Configuration (Embedded H2 for Instant Out-of-the-box Execution)
spring.datasource.url=jdbc:h2:mem:ladies_hostel_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MySQL Alternative Configuration (Uncomment to use local MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/ladies_hostel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL dialect, use: org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security & JWT Configuration
jwt.secret=9a2f8c4e6b1d7a3f5e9c2b4a6d8f0e1c3b5a7d9e1f3a5c7b9d2e4f6a8c0b2d4e
jwt.expirationMs=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

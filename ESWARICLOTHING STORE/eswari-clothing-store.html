const Badge = ({children, color='gold'}) => {
  const colors = {
    gold:{bg:'rgba(201,168,76,0.15)',text:'#C9A84C'},
    green:{bg:'rgba(34,197,94,0.15)',text:'#22C55E'},
    red:{bg:'rgba(239,68,68,0.15)',text:'#EF4444'},
    blue:{bg:'rgba(59,130,246,0.15)',text:'#3B82F6'},
    muted:{bg:'rgba(255,255,255,0.06)',text:'#9CA3AF'},
  };
  const c = colors[color] || colors.muted;
  return (
    <span style={{background:c.bg,color:c.text,padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:500,whiteSpace:'nowrap'}}>
      {children}
    </span>
  );
};

const StatCard = ({icon,label,value,sub,color='gold'}) => {
  const cols = {gold:'#C9A84C',green:'#22C55E',blue:'#3B82F6',purple:'#8B5CF6',red:'#EF4444'};
  const c = cols[color] || cols.gold;
  return (
    <div style={{background:color==='gold'?'linear-gradient(135deg,#1A1D24,#22262F)':'var(--card)',border:`1px solid ${color==='gold'?'rgba(201,168,76,0.3)':'var(--border)'}`,borderRadius:14,padding:'1.25rem 1.5rem',position:'relative',overflow:'hidden'}}>
      <div style={{position:'absolute',top:-10,right:-10,width:80,height:80,background:`${c}12`,borderRadius:'50%'}}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={{fontSize:13,color:'#9CA3AF',letterSpacing:'0.03em'}}>{label}</span>
        <div style={{background:`${c}20`,padding:8,borderRadius:10,color:c}}><Icon name={icon} size={18}/></div>
      </div>
      <div style={{fontSize:26,fontWeight:700,fontFamily:'Playfair Display',color:c}}>{value}</div>
      {sub && <div style={{fontSize:12,color:'#6B7280',marginTop:4}}>{sub}</div>}
    </div>
  );
};

const Btn = ({children,onClick,variant='primary',size='md',icon,disabled=false,style:s={}}) => {
  const base = {display:'inline-flex',alignItems:'center',gap:6,borderRadius:8,fontWeight:500,cursor:disabled?'not-allowed':'pointer',border:'none',transition:'all 0.2s',opacity:disabled?0.5:1,...s};
  const sz = size==='sm'?{padding:'5px 12px',fontSize:13}:{padding:'9px 18px',fontSize:14};
  const vars = {
    primary:{background:'linear-gradient(135deg,#C9A84C,#8B6914)',color:'#0A0A0A'},
    ghost:{background:'transparent',color:'#C9A84C',border:'1px solid rgba(201,168,76,0.4)'},
    danger:{background:'rgba(239,68,68,0.15)',color:'#EF4444',border:'1px solid rgba(239,68,68,0.3)'},
    dark:{background:'rgba(255,255,255,0.06)',color:'#E5E7EB',border:'1px solid var(--border)'},
  };
  return (
    <button onClick={disabled?undefined:onClick} style={{...base,...sz,...vars[variant]}}>
      {icon&&<Icon name={icon} size={15}/>}{children}
    </button>
  );
};

const Input = ({label,value,onChange,placeholder,type='text',style:s={}}) => (
  <div style={{display:'flex',flexDirection:'column',gap:6,...s}}>
    {label&&<label style={{fontSize:12,color:'#9CA3AF',letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}</label>}
    <input
      type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 14px',color:var_text,fontSize:14,outline:'none',transition:'border 0.2s'}}
      onFocus={e=>e.target.style.borderColor='rgba(201,168,76,0.6)'}
      onBlur={e=>e.target.style.borderColor='var(--border)'}
    />
  </div>
);
const Select = ({label,value,onChange,options}) => (
  <div style={{display:'flex',flexDirection:'column',gap:6}}>
    {label&&<label style={{fontSize:12,color:'#9CA3AF',letterSpacing:'0.04em',textTransform:'uppercase'}}>{label}</label>}
    <select value={value} onChange={e=>onChange(e.target.value)}
      style={{background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 14px',color:'#F5F0E8',fontSize:14,outline:'none'}}>
      {options.map(o=><option key={o.value||o} value={o.value||o} style={{background:'#1A1D24'}}>{o.label||o}</option>)}
    </select>
  </div>
);

const Modal = ({show,onClose,title,children,width=480}) => {
  if(!show)return null;
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.75)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}} onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div style={{background:'#1A1D24',border:'1px solid var(--border)',borderRadius:16,width:'100%',maxWidth:width,maxHeight:'90vh',overflowY:'auto',animation:'fadeIn 0.2s ease'}} className="fade-in">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'1.25rem 1.5rem',borderBottom:'1px solid var(--border)'}}>
          <h2 style={{fontSize:18,fontWeight:600,color:'#C9A84C'}}>{title}</h2>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#9CA3AF',cursor:'pointer',fontSize:20,lineHeight:1}}>✕</button>
        </div>
        <div style={{padding:'1.5rem'}}>{children}</div>
      </div>
    </div>
  );
};

const Toast = ({message,type,onDone}) => {
  useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t)},[]);
  const colors = {success:'#22C55E',error:'#EF4444',info:'#3B82F6'};
  return (
    <div style={{position:'fixed',bottom:24,right:24,background:'#1A1D24',border:`1px solid ${colors[type]||colors.info}`,borderRadius:10,padding:'12px 20px',color:'#F5F0E8',fontSize:14,fontWeight:500,zIndex:9999,display:'flex',alignItems:'center',gap:10,boxShadow:'0 8px 32px rgba(0,0,0,0.4)',animation:'slideIn 0.3s ease'}}>
      <span style={{color:colors[type]||colors.info,fontSize:18}}>{type==='success'?'✓':type==='error'?'✗':'ℹ'}</span>
      {message}
    </div>
  );
};

const AreaChartCanvas = ({data, height=200}) => {
  const ref = React.useRef(null);
  const chart = React.useRef(null);
  useEffect(()=>{
    if(!ref.current||!window.Chart)return;
    if(chart.current)chart.current.destroy();
    chart.current = new window.Chart(ref.current,{
      type:'line',
      data:{
        labels:data.map(d=>d.month),
        datasets:[{label:'Revenue',data:data.map(d=>d.revenue),borderColor:'#C9A84C',backgroundColor:'rgba(201,168,76,0.15)',borderWidth:2,fill:true,tension:0.4,pointBackgroundColor:'#C9A84C',pointRadius:4}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`₹${c.raw.toLocaleString()}`}}},scales:{x:{grid:{color:'#2A2E38'},ticks:{color:'#6B7280',font:{size:11}}},y:{grid:{color:'#2A2E38'},ticks:{color:'#6B7280',font:{size:11},callback:v=>`₹${v/1000}k`}}}}
    });
    return()=>{if(chart.current)chart.current.destroy();};
  },[]);
  return <canvas ref={ref} height={height} style={{width:'100%',height}}/>;
};

// BILLING / POS
const BillingPage = ({products,customers,bills,setBills,toast}) => {
  const [search,setSearch]=useState('');
  const [cart,setCart]=useState([]);
  const [custPhone,setCustPhone]=useState('');
  const [discount,setDiscount]=useState(0);
  const [payment,setPayment]=useState('Cash');
  const [showReceipt,setShowReceipt]=useState(false);
  const [lastBill,setLastBill]=useState(null);
  const [coupon,setCoupon]=useState('');

  const filtered = products.filter(p=>
    p.name.toLowerCase().includes(search.toLowerCase())||p.id.toLowerCase().includes(search.toLowerCase())||p.category.toLowerCase().includes(search.toLowerCase())
  );

  const addToCart = p => {
    setCart(c=>{
      const ex = c.find(x=>x.id===p.id);
      if(ex) return c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x);
      return [...c,{...p,qty:1}];
    });
  };
  const removeFromCart = id => setCart(c=>c.filter(x=>x.id!==id));
  const updateQty = (id,delta) => setCart(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+delta)}:x).filter(x=>x.qty>0));

  const subtotal = cart.reduce((s,x)=>s+x.price*x.qty,0);
  const gst = Math.round(subtotal*0.05);
  const discAmt = Math.round((subtotal+gst)*discount/100);
  const total = subtotal+gst-discAmt;

  const applyCoupon = () => {
    const found = COUPONS.find(c=>c.code===coupon.toUpperCase());
    if(found){setDiscount(found.discount);toast(`Coupon applied! ${found.discount}% off`,'success');}
    else toast('Invalid coupon code','error');
  };

  const generateBill = () => {
    if(!cart.length){toast('Cart is empty!','error');return;}
    const bill = {
      id:`B${String(bills.length+1).padStart(3,'0')}`,
      customer: customers.find(c=>c.phone===custPhone)?.name||'Walk-in Customer',
      phone:custPhone||'-',items:cart.length,amount:total,
      date:new Date().toISOString().slice(0,10),payment,status:'Paid',
      cart:[...cart],subtotal,gst,discAmt,discount
    };
    setBills(b=>[bill,...b]);
    setLastBill(bill);setShowReceipt(true);
    setCart([]);setDiscount(0);setCoupon('');setCustPhone('');
    toast('Bill generated!','success');
  };

  return (
    <div className="fade-in" style={{padding:'1.5rem',maxWidth:1100}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 360px',gap:16,alignItems:'start'}}>
        {/* Left: Product Search */}
        <div>
          <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'1.25rem',marginBottom:16}}>
            <div style={{position:'relative',marginBottom:16}}>
              <Icon name='search' size={16} style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6B7280'}}/>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, ID or category…"
                style={{width:'100%',background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px 10px 36px',color:'#F5F0E8',fontSize:14,outline:'none'}}/>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10,maxHeight:340,overflowY:'auto'}}>
              {filtered.map(p=>(
                <div key={p.id} onClick={()=>addToCart(p)} style={{background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',borderRadius:10,padding:'12px',cursor:'pointer',transition:'all 0.2s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(201,168,76,0.5)'}
                  onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}>
                  <div style={{fontSize:28,marginBottom:6}}>{p.image}</div>
                  <div style={{fontSize:12,fontWeight:500,lineHeight:1.3,marginBottom:4,color:'#E5E7EB'}}>{p.name}</div>
                  <div style={{fontSize:11,color:'#6B7280',marginBottom:6}}>{p.category}</div>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <span style={{fontSize:14,fontWeight:700,color:'#C9A84C'}}>₹{p.price.toLocaleString()}</span>
                    <span style={{fontSize:10,color:p.stock<10?'#EF4444':'#22C55E'}}>Qty:{p.stock}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Right: Cart */}
        <div style={{background:'var(--card)',border:'1px solid rgba(201,168,76,0.2)',borderRadius:14,overflow:'hidden',position:'sticky',top:70}}>
          <div style={{padding:'1rem 1.25rem',borderBottom:'1px solid var(--border)',background:'rgba(201,168,76,0.06)'}}>
            <h3 style={{fontSize:15,fontWeight:600,display:'flex',alignItems:'center',gap:8}}>
              <Icon name='cart' size={16} style={{color:'#C9A84C'}}/> Cart ({cart.length} items)
            </h3>
          </div>

          <div style={{padding:'1rem'}}>
            <Input label="Customer Phone" value={custPhone} onChange={setCustPhone} placeholder="9876543210"/>
          </div>

          <div style={{maxHeight:200,overflowY:'auto',padding:'0 1rem'}}>
            {cart.length===0&&<div style={{textAlign:'center',padding:'1.5rem',color:'#4B5563',fontSize:13}}>Click products to add to cart</div>}
            {cart.map(item=>(
              <div key={item.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,0.05)'}}>
                <span style={{fontSize:18}}>{item.image}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{item.name}</div>
                  <div style={{fontSize:11,color:'#C9A84C'}}>₹{item.price.toLocaleString()}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:4}}>
                  <button onClick={()=>updateQty(item.id,-1)} style={{width:22,height:22,borderRadius:4,background:'rgba(255,255,255,0.06)',border:'none',color:'#E5E7EB',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
                  <span style={{fontSize:13,fontWeight:600,minWidth:20,textAlign:'center'}}>{item.qty}</span>
                  <button onClick={()=>updateQty(item.id,1)} style={{width:22,height:22,borderRadius:4,background:'rgba(255,255,255,0.06)',border:'none',color:'#E5E7EB',cursor:'pointer',fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
                </div>
                <button onClick={()=>removeFromCart(item.id)} style={{background:'none',border:'none',color:'#EF4444',cursor:'pointer',padding:2}}><Icon name='delete' size={14}/></button>
              </div>
            ))}
          </div>

          <div style={{padding:'1rem',borderTop:'1px solid var(--border)'}}>
            <div style={{display:'flex',gap:8,marginBottom:10}}>
              <input value={coupon} onChange={e=>setCoupon(e.target.value)} placeholder="Coupon code"
                style={{flex:1,background:'rgba(255,255,255,0.04)',border:'1px solid var(--border)',borderRadius:6,padding:'7px 10px',color:'#F5F0E8',fontSize:13,outline:'none'}}/>
              <Btn size="sm" variant="ghost" onClick={applyCoupon}>Apply</Btn>
            </div>

            {[['Subtotal',`₹${subtotal.toLocaleString()}`],['GST (5%)',`₹${gst.toLocaleString()}`],discount>0?['Discount',`-₹${discAmt.toLocaleString()}`]:null].filter(Boolean).map(([l,v])=>(
              <div key={l} style={{display:'flex',justifyContent:'space-between',marginBottom:8,fontSize:13,color:'#9CA3AF'}}>
                <span>{l}</span><span style={{color:l.includes('Disc')?'#22C55E':'#E5E7EB'}}>{v}</span>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',borderTop:'1px solid var(--border)',fontSize:16,fontWeight:700,color:'#C9A84C'}}>
              <span>Total</span><span>₹{total.toLocaleString()}</span>
            </div>

            <Select label="Payment Method" value={payment} onChange={setPayment}
              options={['Cash','Card','UPI'].map(v=>({value:v,label:v}))}/>
            <button onClick={generateBill} style={{width:'100%',marginTop:12,padding:'11px',background:'linear-gradient(135deg,#C9A84C,#8B6914)',border:'none',borderRadius:10,color:'#0A0A0A',fontSize:14,fontWeight:700,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
              <Icon name='print' size={16}/>Generate Bill
            </button>
          </div>
        </div>
      </div>

      {/* Receipt Modal */}
      <Modal show={showReceipt} onClose={()=>setShowReceipt(false)} title="Bill Receipt" width={400}>
        {lastBill&&(
          <div>
            <div style={{textAlign:'center',marginBottom:20,padding:'16px',background:'rgba(201,168,76,0.06)',borderRadius:10}}>
              <div style={{fontFamily:'Playfair Display',fontSize:20,color:'#C9A84C',marginBottom:4}}>Eswari Clothing Store</div>
              <div style={{fontSize:12,color:'#6B7280'}}>Chennai, Tamil Nadu | GST: 33ABCDE1234F1Z5</div>
              <div style={{fontSize:12,color:'#6B7280',marginTop:4}}>Bill No: {lastBill.id} | {lastBill.date}</div>
            </div>
            <div style={{marginBottom:16}}>
              <div style={{fontSize:13,color:'#9CA3AF',marginBottom:6}}>Customer: <span style={{color:'#E5E7EB'}}>{lastBill.customer}</span></div>
              {lastBill.phone!=='-'&&<div style={{fontSize:13,color:'#9CA3AF'}}>Phone: <span style={{color:'#E5E7EB'}}>{lastBill.phone}</span></div>}
            </div>
            <div style={{borderTop:'1px dashed var(--border)',paddingTop:12,marginBottom:12}}>
              {lastBill.cart.map(item=>(
                <div key={item.id} style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6}}>
                  <span style={{color:'#E5E7EB'}}>{item.name} × {item.qty}</span>
                  <span style={{color:'#C9A84C'}}>₹{(item.price*item.qty).toLocaleString()}</span>
                </div>
              ))}
            </div>
            <div style={{borderTop:'1px dashed var(--border)',paddingTop:12}}>
              {[['Subtotal',`₹${lastBill.subtotal.toLocaleString()}`],['GST (5%)',`₹${lastBill.gst.toLocaleString()}`],lastBill.discount>0?['Discount',`-₹${lastBill.discAmt.toLocaleString()}`]:null].filter(Boolean).map(([l,v])=>(

        <h3 style={{fontSize:15,fontWeight:600,marginBottom:16}}>Best Selling Categories</h3>
        {topCats.map(cat=>(
          <div key={cat.name} style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
            <div style={{fontSize:13,fontWeight:500,minWidth:110,color:'#E5E7EB'}}>{cat.name}</div>
            <div style={{flex:1,height:8,background:'rgba(255,255,255,0.06)',borderRadius:4}}>
              <div style={{width:`${cat.value}%`,height:'100%',background:'linear-gradient(90deg,#C9A84C,#8B6914)',borderRadius:4,transition:'width 0.8s ease'}}/>
            </div>
            <div style={{fontSize:13,color:'#C9A84C',fontWeight:600,minWidth:50,textAlign:'right'}}>{cat.value}%</div>
            <div style={{fontSize:12,color:'#6B7280',minWidth:70,textAlign:'right'}}>₹{(cat.rev/1000).toFixed(0)}k</div>
          </div>
        ))}
      </div>
    </div>
  );
};

// SETTINGS
const SettingsPage = ({toast}) => {
  const [store,setStore]=useState({name:'Eswari Clothing Store',email:'admin@eswari.com',phone:'9876543210',address:'Anna Nagar, Chennai, Tamil Nadu 600040',gst:'33ABCDE1234F1Z5',currency:'INR',taxRate:'5'});
  const [pass,setPass]=useState({current:'',new:'',confirm:''});
  const save = () => toast('Settings saved!','success');
  const changePass = () => {
    if(!pass.current||!pass.new){toast('Fill all fields','error');return;}
    if(pass.new!==pass.confirm){toast('Passwords do not match','error');return;}
    toast('Password changed!','success');setPass({current:'',new:'',confirm:''});
  };
  return (
    <div className="fade-in" style={{padding:'1.5rem',maxWidth:680}}>
      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'1.5rem',marginBottom:16}}>
        <h3 style={{fontSize:16,fontWeight:600,marginBottom:20,display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:20}}>🏪</span> Store Information
        </h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <Input label="Store Name" value={store.name} onChange={v=>setStore(s=>({...s,name:v}))} style={{gridColumn:'1/-1'}}/>
          <Input label="Email" value={store.email} onChange={v=>setStore(s=>({...s,email:v}))}/>
          <Input label="Phone" value={store.phone} onChange={v=>setStore(s=>({...s,phone:v}))}/>
          <Input label="Address" value={store.address} onChange={v=>setStore(s=>({...s,address:v}))} style={{gridColumn:'1/-1'}}/>
          <Input label="GSTIN" value={store.gst} onChange={v=>setStore(s=>({...s,gst:v}))}/>
          <Input label="Tax Rate %" value={store.taxRate} onChange={v=>setStore(s=>({...s,taxRate:v}))} type="number"/>
        </div>
        <div style={{marginTop:16,display:'flex',justifyContent:'flex-end'}}>
          <Btn onClick={save}>Save Changes</Btn>
        </div>
      </div>

      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'1.5rem',marginBottom:16}}>
        <h3 style={{fontSize:16,fontWeight:600,marginBottom:20,display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:20}}>🔒</span> Change Password
        </h3>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <Input label="Current Password" value={pass.current} onChange={v=>setPass(p=>({...p,current:v}))} type="password" placeholder="••••••••"/>
          <Input label="New Password" value={pass.new} onChange={v=>setPass(p=>({...p,new:v}))} type="password" placeholder="••••••••"/>
          <Input label="Confirm New Password" value={pass.confirm} onChange={v=>setPass(p=>({...p,confirm:v}))} type="password" placeholder="••••••••"/>
        </div>
        <div style={{marginTop:16,display:'flex',justifyContent:'flex-end'}}>
          <Btn onClick={changePass}>Update Password</Btn>
        </div>
      </div>

      <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:14,padding:'1.5rem'}}>
        <h3 style={{fontSize:16,fontWeight:600,marginBottom:16,display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontSize:20}}>📱</span> About
        </h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[['App Version','v1.0.0'],['Store Code','ESW-CHN-001'],['Timezone','Asia/Kolkata (IST)'],['Language','English / தமிழ்']].map(([l,v])=>(
            <div key={l} style={{padding:'10px 14px',background:'rgba(255,255,255,0.03)',borderRadius:8}}>
              <div style={{fontSize:11,color:'#6B7280',marginBottom:2}}>{l}</div>
              <div style={{fontSize:13,fontWeight:500,color:'#C9A84C'}}>{v}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ─── APP ─────────────────────────────────────────────────────────────────────
const pageTitles = {dashboard:'Dashboard',billing:'Billing / POS',products:'Products',customers:'Customers',inventory:'Inventory',offers:'Offers & Coupons',analytics:'Analytics',settings:'Settings'};

function App(){
  const [page,setPage]=useState('login');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const [products,setProducts]=useState(INITIAL_PRODUCTS);
  const [customers,setCustomers]=useState(INITIAL_CUSTOMERS);
  const [bills,setBills]=useState(INITIAL_BILLS);
  const [toastMsg,setToastMsg]=useState(null);

  const toast = (msg,type='info') => setToastMsg({msg,type});

  if(page==='login') return <LoginPage onLogin={()=>setPage('dashboard')}/>;

  return (
    <div style={{display:'flex',minHeight:'100vh'}}>
      <Sidebar page={page} setPage={setPage} open={sidebarOpen} setOpen={setSidebarOpen}/>
      <div style={{marginLeft:240,flex:1,minWidth:0,transition:'margin 0.3s'}}>
        <Topbar title={pageTitles[page]||'Dashboard'} setOpen={setSidebarOpen}/>
        <main>
          {page==='dashboard'&&<DashboardPage products={products} customers={customers} bills={bills} setPage={setPage}/>}
          {page==='billing'&&<BillingPage products={products} customers={customers} bills={bills} setBills={setBills} toast={toast}/>}
          {page==='products'&&<ProductsPage products={products} setProducts={setProducts} toast={toast}/>}
          {page==='customers'&&<CustomersPage customers={customers} setCustomers={setCustomers} toast={toast}/>}
          {page==='inventory'&&<InventoryPage products={products} setProducts={setProducts} toast={toast}/>}
          {page==='offers'&&<OffersPage toast={toast}/>}
          {page==='analytics'&&<AnalyticsPage bills={bills} customers={customers}/>}
          {page==='settings'&&<SettingsPage toast={toast}/>}
        </main>
      </div>
      {toastMsg&&<Toast message={toastMsg.msg} type={toastMsg.type} onDone={()=>setToastMsg(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
